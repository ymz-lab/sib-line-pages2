<script>
(() => {
  'use strict';
  const bootstrap = window.BOOTSTRAP || {};
  const STATUS = {active:'フォロー中',pending:'保留',replied:'返信あり',meeting:'商談化',won:'成約',unsubscribed:'配信停止',bounced:'バウンス',completed:'完了'};
  const STEPS = ['D0 初回','D3 リマインド1','D7 最終'];
  const CSV_FIELDS = [['company','会社名'],['person','担当者'],['email','メール'],['industry','業種'],['area','エリア'],['segment','セグメント'],['score','スコア'],['sourceUrl','公表元URL'],['personalNote','個別の一言'],['template','文面バージョン'],['status','状態'],['nextAction','次回アクション日'],['replyType','返信区分'],['meetingDate','商談日'],['meetingResult','結果'],['owner','担当'],['memo','メモ'],['step','ステップ'],['lastSent','最終送信日']];
  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const initials = value => String(value || 'U').replace(/[^A-Za-z0-9ぁ-んァ-ヶ一-龠]/g,'').slice(0,2).toUpperCase();
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const pct = (part,total) => total ? Math.round(part/total*100) : 0;
  const server = (name,...args) => new Promise((resolve,reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || error)))[name](...args));
  let contacts = bootstrap.contacts || [], activities = bootstrap.activities || [], preparedCsv='';

  function init() {
    $('#loading').classList.add('hidden');
    if (!bootstrap.ok) { $('#errorMessage').textContent=bootstrap.error || 'アクセスできません。'; $('#errorView').classList.remove('hidden'); return; }
    if (bootstrap.route === 'portal') initPortal(); else if (bootstrap.route === 'relay') initRelay();
    $$('[data-close]').forEach(button => button.addEventListener('click',()=>$('#'+button.dataset.close).close()));
  }

  function initPortal() {
    $('#portalView').classList.remove('hidden');
    const user=bootstrap.user; $('#portalUserName').textContent=user.name || user.email; $('#portalAvatar').textContent=initials(user.name || user.email);
    $('#toolGrid').innerHTML=(bootstrap.tools||[]).map(tool=>{const href=tool.url || `${bootstrap.webAppUrl}?tool=${encodeURIComponent(tool.route||tool.id)}`;return `<a class="tool-card" href="${esc(href)}"><span class="tool-icon">${esc(tool.icon||'◇')}</span><h3>${esc(tool.name)}</h3><p>${esc(tool.description)}</p><span class="tool-open">ツールを開く <b>→</b></span></a>`}).join('') || '<div class="empty">利用できるツールがありません。</div>';
    if (bootstrap.isAdmin) { $('#openAdminBtn').classList.remove('hidden'); $('#openAdminBtn').addEventListener('click',openAdmin); }
  }

  async function openAdmin() {
    setBusy(true);
    try { const data=await server('listAdminData'); renderAdmin(data,'users'); $('#adminDialog').showModal(); }
    catch(error){toast(error.message,true)} finally{setBusy(false)}
  }
  function renderAdmin(data,tab) {
    $$('.admin-tabs button').forEach(button=>button.classList.toggle('active',button.dataset.adminTab===tab));
    if(tab==='users') $('#adminContent').innerHTML=`<form id="adminUserForm" class="form-grid"><label>メール<input name="email" type="email" required></label><label>氏名<input name="name"></label><label>権限<select name="role"><option value="member">一般</option><option value="admin">管理者</option></select></label><label>利用ツール<input name="tools" value="relay" placeholder="relay または *"></label><label><span>有効</span><input name="enabled" type="checkbox" checked></label><div class="wide dialog-actions"><button class="button primary">利用者を保存</button></div></form><div class="admin-list">${data.users.map(user=>`<div class="admin-item"><span><b>${esc(user.name||user.email)}</b><br><small>${esc(user.email)} / ${esc(user.role)} / ${esc(user.tools)}</small></span><button class="button secondary" data-edit-user='${esc(JSON.stringify(user))}'>編集</button></div>`).join('')}</div>`;
    else $('#adminContent').innerHTML=`<form id="adminToolForm" class="form-grid"><label>ツールID<input name="id" required placeholder="tool-name"></label><label>名称<input name="name" required></label><label class="wide">説明<input name="description"></label><label>内部ルート<input name="route"></label><label>外部URL<input name="url"></label><label>アイコン<input name="icon" value="◇"></label><label>表示順<input name="sort" type="number" value="100"></label><label><span>有効</span><input name="enabled" type="checkbox" checked></label><div class="wide dialog-actions"><button class="button primary">ツールを保存</button></div></form><div class="admin-list">${data.tools.map(tool=>`<div class="admin-item"><span><b>${esc(tool.name)}</b><br><small>${esc(tool.id)} / ${esc(tool.route||tool.url)}</small></span><button class="button secondary" data-edit-tool='${esc(JSON.stringify(tool))}'>編集</button></div>`).join('')}</div>`;
    const userForm=$('#adminUserForm'); if(userForm) userForm.addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,input=Object.fromEntries(new FormData(form));input.enabled=form.elements.enabled.checked;await saveAdmin('savePortalUser',input)});
    const toolForm=$('#adminToolForm'); if(toolForm) toolForm.addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,input=Object.fromEntries(new FormData(form));input.enabled=form.elements.enabled.checked;await saveAdmin('savePortalTool',input)});
    $$('[data-edit-user]').forEach(button=>button.addEventListener('click',()=>fillForm($('#adminUserForm'),JSON.parse(button.dataset.editUser))));
    $$('[data-edit-tool]').forEach(button=>button.addEventListener('click',()=>fillForm($('#adminToolForm'),JSON.parse(button.dataset.editTool))));
  }
  async function saveAdmin(method,input){setBusy(true);try{await server(method,input);const data=await server('listAdminData');renderAdmin(data,method==='savePortalUser'?'users':'tools');toast('保存しました')}catch(error){toast(error.message,true)}finally{setBusy(false)}}
  $$('.admin-tabs button').forEach(button=>button.addEventListener('click',async()=>{const data=await server('listAdminData');renderAdmin(data,button.dataset.adminTab)}));

  function initRelay() {
    $('#relayView').classList.remove('hidden');
    const d=new Date(); $('#relayDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    renderRelay();
    $$('.nav[data-view]').forEach(button=>button.addEventListener('click',()=>switchRelayView(button.dataset.view)));
    $('#addContactBtn').addEventListener('click',()=>openContact()); $('#contactForm').addEventListener('submit',submitContact); $('#actionForm').addEventListener('submit',submitAction);
    $('#searchInput').addEventListener('input',renderContacts); $('#statusFilter').addEventListener('change',renderContacts);
    $('#exportBtn').addEventListener('click',openCsvExport); $('#csvInput').addEventListener('change',event=>event.target.files[0]&&importCsv(event.target.files[0]));
    $('#downloadCsvBtn').addEventListener('click',downloadCsv); $('#copyCsvBtn').addEventListener('click',copyCsv);
    document.addEventListener('click',relayClickHandler);
  }
  function renderRelay(){renderHome();renderContacts();renderReports()}
  function dueContacts(){return contacts.filter(c=>['active','pending'].includes(c.status)&&c.nextAction&&c.nextAction<=today()).sort((a,b)=>Number(b.score)-Number(a.score))}
  function replied(){return contacts.filter(c=>c.replyType||['replied','meeting','won'].includes(c.status))}
  function meetings(){return contacts.filter(c=>c.meetingDate||['meeting','won'].includes(c.status))}
  function renderHome(){const due=dueContacts(),sent=contacts.filter(c=>c.lastSent),reply=replied(),meeting=meetings();$('#dueCount').textContent=due.length;$('#dueBadge').textContent=due.length+'件';$('#metricGrid').innerHTML=[metric('返信率',pct(reply.length,sent.length)+'%',reply.length+'/'+sent.length+'件'),metric('商談化率',pct(meeting.length,sent.length)+'%',meeting.length+'件が商談へ'),metric('今月の商談',contacts.filter(c=>String(c.meetingDate).startsWith(today().slice(0,7))).length+'件','商談日ベース'),metric('アクティブ',contacts.filter(c=>c.status==='active').length+'件','フォロー進行中')].join('');$('#dueList').innerHTML=due.length?due.map(c=>`<article class="due-row"><div class="contact"><span class="company-icon">${esc(initials(c.company))}</span><span><b>${esc(c.company)}</b><small>${esc(c.person)}・${esc(c.email)}</small></span></div><span class="step step-${c.step}">${esc(STEPS[c.step]||'完了')}</span><span class="owner">${esc(c.owner||'未設定')}</span><span class="note">${esc(c.personalNote||'個別の一言なし')}</span><div class="row-actions"><button class="button primary" data-action="sent" data-id="${esc(c.id)}">送信を記録</button>${actionMenu(c.id)}</div></article>`).join(''):'<div class="empty">今日のフォローは完了です。</div>'}
  function metric(label,value,note){return `<article class="metric"><span>${esc(label)}</span><b>${esc(value)}</b><small>${esc(note)}</small></article>`}
  function actionMenu(id){return `<div class="action-menu"><button class="menu-button" data-menu="${esc(id)}">•••</button><div class="menu" data-menu-panel="${esc(id)}"><button data-action="reply" data-id="${esc(id)}">返信を記録</button><button data-action="meeting" data-id="${esc(id)}">商談化</button><button data-action="pending" data-id="${esc(id)}">90日保留</button><button data-action="unsubscribed" data-id="${esc(id)}">配信停止</button><button data-action="bounced" data-id="${esc(id)}">バウンス</button></div></div>`}
  function renderContacts(){const query=($('#searchInput')?.value||'').toLowerCase(),filter=$('#statusFilter')?.value||'all';const rows=contacts.filter(c=>(filter==='all'||c.status===filter)&&[c.company,c.person,c.email,c.industry,c.area,c.segment].join(' ').toLowerCase().includes(query));$('#contactRows').innerHTML=rows.map(c=>`<tr><td><div class="contact"><span class="company-icon">${esc(initials(c.company))}</span><span><b>${esc(c.company)}</b><small>${esc(c.person)}・${esc(c.email)}</small></span></div></td><td>${esc(c.segment)}</td><td>${Number(c.score)||0}</td><td><span class="status status-${esc(c.status)}">${esc(STATUS[c.status]||c.status)}</span></td><td>${esc(c.nextAction||'—')}</td><td>${esc(c.owner||'—')}</td><td><button class="menu-button" data-edit="${esc(c.id)}">•••</button></td></tr>`).join('');$('#contactCount').textContent=`${rows.length} / ${contacts.length}件`}
  function renderReports(){const sent=contacts.filter(c=>c.lastSent),delivered=sent.filter(c=>c.delivered!==false),reply=replied(),positive=reply.filter(c=>c.replyType==='前向き'),meeting=meetings(),won=contacts.filter(c=>c.status==='won'),unsub=contacts.filter(c=>c.status==='unsubscribed');$('#reportMetrics').innerHTML=[metric('送達率',pct(delivered.length,sent.length)+'%',delivered.length+'件'),metric('返信率',pct(reply.length,delivered.length)+'%',reply.length+'件'),metric('前向き返信率',pct(positive.length,delivered.length)+'%',positive.length+'件'),metric('商談化率',pct(meeting.length,delivered.length)+'%',meeting.length+'件'),metric('成約率',pct(won.length,delivered.length)+'%',won.length+'件'),metric('配信停止率',pct(unsub.length,delivered.length)+'%',unsub.length+'件')].join('');const counts=[0,1,2].map(step=>reply.filter(c=>Number(c.replyStep)===step).length),max=Math.max(1,...counts);$('#stepChart').innerHTML=counts.map((count,index)=>`<div class="bar-col"><b>${count}件</b><i class="bar" style="height:${Math.max(4,pct(count,max))}%"></i><small>${STEPS[index]}</small></div>`).join('');const segments=[...new Set(contacts.map(c=>c.segment||'未設定'))];$('#segmentReport').innerHTML=segments.map(segment=>{const all=contacts.filter(c=>(c.segment||'未設定')===segment),r=all.filter(c=>c.replyType||['replied','meeting','won'].includes(c.status)),m=all.filter(c=>c.meetingDate||['meeting','won'].includes(c.status));return `<div class="segment-row"><b>${esc(segment)}</b><span>${all.length}件</span><span>返信 ${pct(r.length,all.length)}% / 商談 ${pct(m.length,all.length)}%</span></div>`}).join('')}
  function switchRelayView(view){$$('.relay-section').forEach(section=>section.classList.toggle('active',section.id===`relay-${view}`));$$('.nav[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));$('#relayTitle').textContent={home:'おはようございます',contacts:'コンタクト管理',reports:'レポート'}[view];if(view==='contacts')renderContacts();if(view==='reports')renderReports()}
  function relayClickHandler(event){const edit=event.target.closest('[data-edit]');if(edit)openContact(contacts.find(c=>c.id===edit.dataset.edit));const action=event.target.closest('[data-action]');if(action)openAction(action.dataset.id,action.dataset.action);const menu=event.target.closest('[data-menu]');if(menu){event.stopPropagation();const panel=$(`[data-menu-panel="${menu.dataset.menu}"]`);$$('.menu').forEach(el=>el!==panel&&el.classList.remove('open'));panel.classList.toggle('open')}else if(!event.target.closest('.menu'))$$('.menu').forEach(el=>el.classList.remove('open'))}
  function openContact(contact){const form=$('#contactForm');form.reset();$('#contactDialogTitle').textContent=contact?'コンタクト編集':'コンタクト追加';if(contact)Object.entries(contact).forEach(([key,value])=>{if(form.elements[key])form.elements[key].value=value??''});else{form.elements.nextAction.value=today();form.elements.owner.value=bootstrap.user.name||''}$('#contactDialog').showModal()}
  async function submitContact(event){event.preventDefault();const form=event.currentTarget,input=Object.fromEntries(new FormData(form));input.score=Number(input.score||0);setBusy(true);try{await server('saveContact',input);$('#contactDialog').close();await refreshRelay();toast('保存しました')}catch(error){toast(error.message,true)}finally{setBusy(false)}}
  function openAction(id,action){const c=contacts.find(item=>item.id===id);if(!c)return;const form=$('#actionForm');form.reset();form.elements.contactId.value=id;form.elements.action.value=action;$('#actionTitle').textContent={sent:'送信を記録',reply:'返信を記録',meeting:'商談化',pending:'90日保留',unsubscribed:'配信停止',bounced:'バウンス'}[action]+'｜'+c.company;$('#actionExtra').innerHTML=action==='reply'?'<label>返信区分<select name="replyType"><option>前向き</option><option>情報収集</option><option>時期尚早</option><option>お断り</option></select></label>':action==='meeting'?`<label>商談日<input type="date" name="meetingDate" value="${today()}"></label>`:'';$('#actionDialog').showModal()}
  async function submitAction(event){event.preventDefault();const form=event.currentTarget,data=Object.fromEntries(new FormData(form));setBusy(true);try{await server('recordContactAction',data.contactId,data.action,{memo:data.memo,replyType:data.replyType,meetingDate:data.meetingDate});$('#actionDialog').close();await refreshRelay();toast('対応結果を記録しました')}catch(error){toast(error.message,true)}finally{setBusy(false)}}
  async function refreshRelay(){const data=await server('getRelayData');contacts=data.contacts;activities=data.activities;renderRelay()}

  function openCsvExport(){const cell=value=>`"${String(value??'').replace(/"/g,'""')}"`;preparedCsv=[CSV_FIELDS.map(([,label])=>cell(label)).join(','),...contacts.map(c=>CSV_FIELDS.map(([key])=>cell(key==='status'?STATUS[c[key]]||c[key]:c[key])).join(','))].join('\r\n');$('#csvPreview').value=preparedCsv;$('#csvDialog').showModal()}
  function downloadCsv(){const blob=new Blob(['\ufeff'+preparedCsv],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`relay-contacts-${today()}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
  async function copyCsv(){try{await navigator.clipboard.writeText(preparedCsv);toast('CSVをコピーしました')}catch(error){const textarea=$('#csvPreview');textarea.select();toast(document.execCommand('copy')?'CSVをコピーしました':'CSV欄を選択してコピーしてください')}}
  function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
  function importCsv(file){const reader=new FileReader();reader.onload=async()=>{try{const rows=parseCsv(String(reader.result).replace(/^\ufeff/,'')),headers=rows.shift(),keys=headers.map(h=>CSV_FIELDS.find(([key,label])=>h===key||h===label)?.[0]||h),data=rows.map(row=>Object.fromEntries(keys.map((key,index)=>[key,row[index]||''])));setBusy(true);const result=await server('importContacts',data);await refreshRelay();toast(result.count+'件を取り込みました')}catch(error){toast(error.message,true)}finally{setBusy(false);$('#csvInput').value=''}};reader.readAsText(file,'UTF-8')}

  function fillForm(form,data){Object.entries(data).forEach(([key,value])=>{const el=form.elements[key];if(!el)return;if(el.type==='checkbox')el.checked=value===true||String(value).toLowerCase()==='true';else el.value=value??''})}
  function toast(message,isError){const el=$('#toast');el.textContent=message;el.style.background=isError?'#8b3030':'#173b2c';el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800)}
  function setBusy(value){$('#loading').classList.toggle('hidden',!value)}
  init();
})();
</script>
