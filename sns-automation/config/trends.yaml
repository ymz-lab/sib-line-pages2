# 手動で把握しているトレンド（任意）。
# `research` コマンドはWeb検索で最新トレンドを自動収集しますが、
# 自分で見つけたバズ・流行りの音源・フォーマットをここに足すと優先的に考慮されます。

manual_trends:
  - name: "就活の本音シリーズ"
    platform: instagram_reel
    note: 先輩が後輩に本音で語るインタビュー形式が学生層で伸びている
  - name: "〇〇してみた ビフォーアフター"
    platform: tiktok/reel
    note: 挑戦前後の変化を見せるフォーマット

# research時の検索観点
research_focus:
  - 大学生・Z世代に今バズっているリール/TikTokのフォーマットと音源
  - 就活・インターン・学生起業に関するSNSで話題のテーマ
  - 湘南・藤沢・茅ヶ崎エリアの今月のイベントや話題
  - X（旧Twitter）で学生・キャリア系の伸びている投稿の型
