# 自社アカウントの方向性・目的。生成されるすべての投稿の土台になります。
# 実態に合わせて自由に書き換えてください（箇条書きで十分です）。

account_name: SIB（Shonan Innovation Base）
handles:
  instagram: "@sib_shonan"   # 実際のアカウント名に変更
  x: "@sib_shonan"           # 実際のアカウント名に変更

mission: >
  湘南エリアを中心に、学生に「挑戦と出会いのきっかけ」を届ける学生コミュニティ。
  学生・企業・地域をつなぎ、経験が語れる学生を増やす。

goals:   # SNSで達成したいこと（優先順）
  - 学生メンバー登録（公式LINE経由）を月30件獲得する
  - イベント集客（ピッチコンテスト・交流会・勉強会）
  - 協賛・連携企業の獲得に向けた信頼形成（実績の可視化）
  - 湘南エリアでの認知拡大

target_audiences:
  - name: 大学生（1〜3年）
    pains: ["就活で話せる経験がない", "何から始めればいいか分からない", "人脈が広がらない"]
    desires: ["実践経験", "同世代の意欲ある仲間", "経営者・企業との接点", "進路の解像度"]
  - name: 企業の採用・広報担当 / 経営者
    pains: ["学生との接点がない", "若者に届く発信ができない"]
    desires: ["採用候補との関係形成", "若者目線の広報", "地域でのブランド形成"]

tone:
  voice: 明るく前向き、学生の熱量が伝わる。上から目線にならず「一緒にやろう」の距離感。
  do: ["実際の活動写真・リアルな声を使う", "数字で実績を示す（参加学生300名+ 等）", "最後に1つだけ明確なCTA"]
  dont: ["誇大表現・断定的な成果保証", "他団体の批判", "過度な内輪ネタ"]

content_pillars:   # 発信の柱（比率は目安）
  - name: 活動のリアル
    share: 35
    description: イベント・ピッチ・ワークショップの裏側やメンバーの挑戦
  - name: 学生のキャリアのヒント
    share: 25
    description: 就活・インターン・学生起業に役立つ学び、経営者の言葉
  - name: 企業・地域との共創
    share: 20
    description: 協賛企業・行政・地域との取り組み、企業目線のメリット
  - name: 参加・登録の導線
    share: 20
    description: イベント告知、メンバー募集、LINE登録

key_facts:   # 投稿で使ってよい事実（AIが数字を捏造しないよう、ここに書いたものだけを使います）
  - 累計参加学生300名以上、累計イベント15回以上、協力企業10社以上、運営メンバー20名以上
  - 2025年4月5日 第一回ピッチコンテスト（新宿・会議室FOREST、学生50名、スポンサー企業10社）
  - 2025年9月27日 SIB × HERO'ZZ 共催イベント（浜松町PREX、VAMBIさん・水畑裕貴さん登壇）
  - メンバー登録はフォーム回答後、公式LINEで「SIB登録完了」と送信

cta:
  default: プロフィールのリンクから公式LINEに登録
  url: https://example.com/line   # 公式LINEの友だち追加URLに変更

posting_cadence:   # 1週間あたりの本数
  reel: 3
  feed: 2
  story: 5
  x: 7

ng_words: ["絶対", "必ず稼げる", "誰でも簡単"]
language: ja
